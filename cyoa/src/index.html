<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CYOA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
body {
  background-color: beige;
}

p {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: center;
}

/* Navbar at the top of the page */
.container {
  background-color: skyblue;
  text-align: center;
}
/* Dropdown container */
.dropdown {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  position: relative;
  display: inline-block;
  text-align: center;
  padding: 6px;
}

/* Dropdown button */
.dropbtn {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: lightgreen;
  color: black;
  padding: 12px 24px;
  font-size: 16px;
  text-align: center;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

/* Dropdown content (hidden by default) */
.dropdown-content {
  display: none;
  text-align: center;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  border-radius: 6px;
  z-index: 1;
}

/* Links inside dropdown */
.dropdown-content a {
  color: black;
  padding: 10px 16px;
  text-decoration: none;
  display: block;
}

/* Hover effect for dropdown links */
.dropdown-content a:hover {
  background-color: #f1f1f1;
}

/* Show dropdown on hover */
.dropdown:hover .dropdown-content {
  display: block;
}

/* Change button color on hover */
.dropdown:hover .dropbtn {
  background-color: #3e8e41;
}
  </style>
</head>
<body>
  <app-root></app-root>
    <div class="container">
      <div class="dropdown">
        <button class="dropbtn">Menu</button>
          <div class="dropdown-content">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="interactive.html">Interactive</a>
          </div>
      </div>
    </div>  
  <p>Welcome to CYOA (Choose your own adventure). This is a website designed for you to create your own adventure story
    with the help of our own CYOA AI.
  </p>
</body>
</html>
